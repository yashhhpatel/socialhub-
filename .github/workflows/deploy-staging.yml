name: Deploy (staging)

# Milestone 6.2 — staging deploy pipeline.
#
# On a pull request to main: BUILD both images only, so a broken Dockerfile
# is caught in review, never on main.
# On a push to main (i.e. a merge): build AND publish both images to the
# GitHub Container Registry, then optionally poke the staging host to pull.
#
# Publishing to GHCR needs no external secret — it uses the built-in
# GITHUB_TOKEN. The final hop to a running staging environment depends on
# where staging lives, so it is gated behind STAGING_DEPLOY_WEBHOOK and
# no-ops until that secret is set.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/socialhub-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/socialhub-frontend

jobs:
  images:
    name: Build & publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only publish on a real merge to main; PRs build for validation only.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:staging
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (and push on main) frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          # Staging frontend points at the staging API. Set repo variable
          # STAGING_API_BASE_URL; falls back to localhost for a bare build.
          build-args: |
            API_BASE_URL=${{ vars.STAGING_API_BASE_URL || 'http://localhost:3000' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:staging
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger staging deploy
    needs: images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Poke the staging host to pull the new images
        env:
          WEBHOOK: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "STAGING_DEPLOY_WEBHOOK is not set — images are published to"
            echo "GHCR (:staging), but no host was told to redeploy."
            echo "Add the secret to enable the final hop."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK"
          echo "Staging redeploy triggered."
