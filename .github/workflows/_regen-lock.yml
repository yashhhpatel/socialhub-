name: _regen-lock (temporary)

# TEMPORARY, one-off. Regenerates backend/package-lock.json ON LINUX — the
# platform CI actually installs on — because npm resolves the dependency
# tree differently on Linux vs Windows for this graph (the @prisma/studio-core
# React peer subtree), so a Windows-generated lockfile is rejected by
# `npm ci` on the runner. Uploads the corrected lockfile as an artifact for
# a human to download and commit. Delete this workflow once the lockfile
# is fixed.
on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Regenerate lockfile from package.json (Linux resolution)
        working-directory: backend
        run: npm install --package-lock-only

      - name: Prove the regenerated lockfile is self-consistent here
        working-directory: backend
        run: npm ci --dry-run

      - name: Upload corrected lockfile
        uses: actions/upload-artifact@v4
        with:
          name: backend-package-lock
          path: backend/package-lock.json
