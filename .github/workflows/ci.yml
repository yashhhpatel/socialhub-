name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  frontend:
    name: Frontend (Flutter Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend project
        id: detect
        run: |
          if [ -f "frontend/pubspec.yaml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Steps below activate once Milestone 0.2 scaffolds the Flutter project.
      - name: Set up Flutter
        if: steps.detect.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the SDK this project is actually developed against
          # (pubspec declares flutter '>=3.22.0' with no upper bound, so an
          # unpinned `stable` installed whatever was newest — which is how
          # `flutter analyze` failed here while passing locally: the 24
          # withOpacity call sites are fine on 3.22 and deprecated from 3.27
          # onward, and analyze exits non-zero on infos.
          #
          # This pin is a stopgap, not a destination. The real fix is to
          # migrate off the deprecated APIs (withOpacity -> withValues,
          # Color.value -> toARGB32) and move back to tracking stable.
          flutter-version: '3.22.3'

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: flutter analyze

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: flutter test

      - name: Build (web)
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: flutter build web

      - name: No-op placeholder
        if: steps.detect.outputs.exists == 'false'
        run: echo "frontend project not yet scaffolded (pending Milestone 0.2) — skipping"

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    env:
      # `prisma generate` does not connect to a database, but prisma.config.ts
      # resolves `env('DATABASE_URL')` while loading, and Prisma 7 throws
      # PrismaConfigEnvError if the variable is absent. CI has no .env file,
      # so the value has to come from somewhere — this is a syntactically
      # valid placeholder that is never dialled, NOT a real credential.
      # A job needing an actual database (e.g. e2e in a later phase) must
      # bring its own service container and override this.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend project
        id: detect
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Steps below activate once Milestone 0.3 scaffolds the NestJS project.
      - name: Set up Node
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          # 22, not 20: prisma@7.8 runs a preinstall gate that hard-exits on
          # unsupported runtimes ("Node.js versions 20.19+, 22.12+, 24.0+"),
          # and @prisma/streams-local — a non-optional dev dependency —
          # declares "node": ">=22.0.0", which no Node 20 build satisfies.
          # `node-version: '20'` resolves to the runner's cached Node 20,
          # so `npm ci` died in preinstall before installing anything.
          # Node 20 also reached end of life in April 2026.
          #
          # Pinned to the minor, not the bare major: setup-node prefers a
          # matching version already in the runner's tool cache over
          # downloading the newest, so a floating '22' can still land on
          # 22.0–22.11 and trip the very same gate. 22.12 is also the
          # version this project is developed and verified against.
          node-version: '22.12'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: npm ci

      # Required, and easy to miss: @prisma/client v7 dropped the postinstall
      # that used to generate the client automatically, so `npm ci` alone
      # leaves node_modules/.prisma absent. Without this step the generated
      # types don't exist and both `npm run test` and `npm run build` fail on
      # every model access (`Property 'user' does not exist...`). It never
      # showed up before because the install step failed first.
      - name: Generate Prisma Client
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: npx prisma generate

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: npm run lint

      - name: Test
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: npm run test

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: npm run build

      - name: No-op placeholder
        if: steps.detect.outputs.exists == 'false'
        run: echo "backend project not yet scaffolded (pending Milestone 0.3) — skipping"
