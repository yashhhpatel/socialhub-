name: socialhub
description: "SocialHub — AI-powered social media operating system."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (see docs/architecture — Flutter Web Application Architecture, §2)
  flutter_riverpod: ^2.5.1

  # Routing (see docs/architecture — Flutter Web Application Architecture, §4)
  go_router: ^14.2.0

  # Networking — chosen over the plain `http` package specifically for its
  # built-in Interceptor abstraction, needed for the silent token-refresh
  # flow (see core/network/auth_interceptor.dart).
  dio: ^5.7.0

  cupertino_icons: ^1.0.8

  # Locale-aware date formatting for the dashboard greeting header.
  intl: ^0.19.0

  # QR rendering for TOTP MFA enrollment (Phase 17.3): turns the otpauth://
  # URI into a scannable code. Pure-Dart, no native/platform channels.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # Lato is the product typeface (see core/theme/app_theme.dart). Lato is not
    # a variable font, so we bundle its static weights and tag each with its
    # `weight`. The theme requests 400/500/600/700; Flutter renders 400 and 700
    # from these files exactly and resolves 500/600 to the nearest bundled
    # weight (→ 400 and → 700). Without the family declared here the 'Lato'
    # name would silently fall back to the platform default.
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
