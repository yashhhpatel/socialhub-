# Static hosting for the Flutter Web bundle (Milestone 6.2).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compress the text-ish assets; the big one is main.dart.js.
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # The app uses hash-based routing (#/dashboard), so deep links resolve
    # client-side and every real request is for "/" or a static asset. The
    # fallback to index.html covers a hard refresh at any path regardless.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-addressed build assets can be cached hard; index.html must not,
    # or a client keeps booting a stale bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
