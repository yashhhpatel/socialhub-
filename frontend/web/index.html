<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SocialHub — AI-powered social media operating system.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SocialHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D0F14">

  <title>SocialHub</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    /* First-paint loading state: matches the app's Midnight Studio dark theme
       (see core/theme/app_colors.dart) so there's no light-to-dark flash
       before the Flutter engine finishes booting. Flutter paints its own
       opaque canvas on top, so this naturally disappears once loaded. */
    html, body { margin: 0; height: 100%; }
    body {
      background: #0D0F14; /* AppColors.background */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #boot-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
    }
    #boot-loader .mark {
      width: 52px; height: 52px; border-radius: 16px;
      background: linear-gradient(135deg, #6C5CE7, #A29BFE); /* accent → accentHover */
      box-shadow: 0 8px 22px rgba(108, 92, 231, 0.4);
    }
    #boot-loader .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid #2A303C; border-top-color: #6C5CE7; /* border / accent */
      animation: spin 0.8s linear infinite;
    }
    #boot-loader .label { color: #8A92A3; font-size: 14px; } /* textMuted */
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="mark"></div>
    <div class="spinner"></div>
    <div class="label">Loading SocialHub…</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
