services:
  postgres:
    image: postgres:16-alpine
    container_name: socialhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialhub
      POSTGRES_PASSWORD: socialhub
      POSTGRES_DB: socialhub
    ports:
      - "5432:5432"
    volumes:
      - socialhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis backs the BullMQ publish/schedule queues (Milestone 7.1).
  # appendonly persistence so an enqueued-but-not-yet-processed publish job
  # survives a Redis restart rather than silently vanishing.
  redis:
    image: redis:7-alpine
    container_name: socialhub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - socialhub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  socialhub_postgres_data:
  socialhub_redis_data:
